# 生产环境：静态文件 + /api 反向代理（deploy/docker-compose.prod.yml）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 4m;

    # 前面还有一层宿主机上的反向代理（如 1Panel 的 openresty，负责 HTTPS）时，请求从 Docker 网关进来，
    # $remote_addr 是网关地址。只对来自这些地址的请求信任 X-Real-IP，取出真实的客户端 IP；
    # 宿主机代理要用真实地址设置 X-Real-IP（proxy_set_header X-Real-IP $remote_addr）。
    # 直接从外网访问的请求不在这些网段里，伪造的 X-Real-IP 不会被采用。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 服务端开启 TRUST_PROXY 后按这些头取客户端 IP（用于限流）：一律用真实地址覆盖，客户端无法伪造
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # M5 的 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # 带哈希的打包文件可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 其余路径交给前端路由（/login、/register 等）
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
